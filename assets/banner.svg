<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="pnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080718" /><stop offset="50%" stop-color="#120e2e" /><stop offset="100%" stop-color="#050412" />
    </linearGradient>
    <linearGradient id="pnNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"><animate attributeName="stop-color" values="#f97316;#a855f7;#06b6d4;#f97316" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="50%" stop-color="#a855f7"><animate attributeName="stop-color" values="#a855f7;#ec4899;#f97316;#a855f7" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="100%" stop-color="#06b6d4"><animate attributeName="stop-color" values="#06b6d4;#f97316;#a855f7;#06b6d4" dur="7s" repeatCount="indefinite" /></stop>
    </linearGradient>
    <linearGradient id="pnGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0" /><stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>
    <filter id="pnGlow"><feGaussianBlur stdDeviation="5" result="b" /><feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge></filter>
  </defs>

  <style>
    @keyframes pnFloat { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-12px) rotate(1.5deg); } }
    .floating-panel { animation: pnFloat 5.5s ease-in-out infinite; }
  </style>

  <rect width="1200" height="360" fill="url(#pnBg)" />

  <!-- 3D Ground Grid -->
  <g opacity="0.6">
    <line x1="0" y1="260" x2="1200" y2="260" stroke="#f97316" stroke-opacity="0.25" stroke-width="1" />
    <line x1="600" y1="260" x2="0" y2="360" stroke="url(#pnGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="250" y2="360" stroke="url(#pnGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="500" y2="360" stroke="url(#pnGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="700" y2="360" stroke="url(#pnGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="950" y2="360" stroke="url(#pnGrid)" stroke-width="1.5" />
    <line x1="600" y1="260" x2="1200" y2="360" stroke="url(#pnGrid)" stroke-width="1.5" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#f97316" stroke-opacity="0.2" stroke-width="1" />
    <line x1="0" y1="340" x2="1200" y2="340" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <!-- Ambient Light -->
  <circle cx="200" cy="110" r="140" fill="#f97316" opacity="0.08" filter="url(#pnGlow)" />
  <circle cx="960" cy="170" r="160" fill="#a855f7" opacity="0.12" filter="url(#pnGlow)" />

  <!-- 3D Isometric Cyber Shield & Tunnel Nodes -->
  <g transform="translate(940, 180)" class="floating-panel">
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#pnNeon)" stroke-width="2" stroke-dasharray="8 6" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite" />
    </circle>
    <!-- Isometric Shield Outer -->
    <polygon points="0,-75 60,-35 45,45 0,75 -45,45 -60,-35" fill="#181333" stroke="#f97316" stroke-width="2.5" filter="url(#pnGlow)" opacity="0.95" />
    <!-- Isometric Shield Inner Core -->
    <polygon points="0,-50 40,-25 30,30 0,50 -30,30 -40,-25" fill="#2e1065" stroke="#a855f7" stroke-width="2" opacity="0.85" />

    <!-- Center Edge Glowing Core -->
    <circle cx="0" cy="0" r="14" fill="#f97316" filter="url(#pnGlow)">
      <animate attributeName="r" values="12;18;12" dur="3s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#f97316;#a855f7;#06b6d4;#f97316" dur="7s" repeatCount="indefinite" />
    </circle>

    <!-- Floating Protocol Tags -->
    <g transform="translate(-115, -45)">
      <rect x="0" y="0" width="80" height="22" rx="6" fill="#0e0a24" stroke="#f97316" stroke-width="1" />
      <text x="40" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#fb923c" text-anchor="middle">WIREGUARD</text>
    </g>
    <g transform="translate(60, 25)">
      <rect x="0" y="0" width="75" height="22" rx="6" fill="#0e0a24" stroke="#a855f7" stroke-width="1" />
      <text x="37" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#c084fc" text-anchor="middle">CF WORKERS</text>
    </g>
    <g transform="translate(-40, 65)">
      <rect x="0" y="0" width="80" height="22" rx="6" fill="#0e0a24" stroke="#06b6d4" stroke-width="1" />
      <text x="40" y="15" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" fill="#22d3ee" text-anchor="middle">EDGE KV</text>
    </g>
  </g>

  <!-- Left Typography -->
  <g transform="translate(80, 140)">
    <g transform="translate(0, -35)">
      <rect x="0" y="-14" width="255" height="24" rx="12" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-width="1" />
      <circle cx="12" cy="-2" r="4" fill="#f97316" />
      <text x="26" y="2" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#f97316" letter-spacing="2">EDGE VPN &amp; MESH GATEWAY</text>
    </g>

    <text x="0" y="32" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-size="52" font-weight="900" fill="url(#pnNeon)" filter="url(#pnGlow)" letter-spacing="3">
      PIMX_PASS_PANEL
    </text>

    <text x="0" y="68" font-family="'Fira Code', monospace" font-size="16" font-weight="600" fill="#e2e8f0" letter-spacing="1">
      ⚡ Serverless Edge VPN Management, WireGuard &amp; Cloudflare KV
    </text>

    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="165" height="26" rx="6" fill="#130e2c" stroke="#f97316" stroke-width="1" />
      <text x="82" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#fb923c" text-anchor="middle">🛡️ WireGuard / VLESS</text>

      <rect x="175" y="0" width="160" height="26" rx="6" fill="#130e2c" stroke="#a855f7" stroke-width="1" />
      <text x="255" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">⚡ Cloudflare Workers</text>

      <rect x="345" y="0" width="150" height="26" rx="6" fill="#130e2c" stroke="#06b6d4" stroke-width="1" />
      <text x="420" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#22d3ee" text-anchor="middle">🌐 Global Low Ping</text>

      <rect x="505" y="0" width="150" height="26" rx="6" fill="#130e2c" stroke="#34d399" stroke-width="1" />
      <text x="580" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">🔒 Zero-Log Policy</text>
    </g>
  </g>

  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#pnNeon)" stroke-width="3" filter="url(#pnGlow)" />
</svg>